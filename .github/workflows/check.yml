name: RoboNav-3D checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q streamlit_app.py backend
      - name: Test search algorithms and experiments
        run: python -m unittest discover -s backend/tests -v
      - name: Check animated homepage JavaScript
        run: node --input-type=module --check < home/story.js
